# Web deployment: nginx serving the Vite build + isomorphic-git CORS proxy.
# The web image builds the application itself (multi-stage Dockerfile.web) —
# no local `pnpm build` needed. Works the same with `docker compose` or
# `podman-compose` (or `podman compose`, once podman-compose is installed).
#
# Defaults work out of the box for local use: the app is served at
# http://localhost:8080/ (WEB_PORT below) and talks to the CORS proxy at
# the same origin via /cors-proxy/ (nginx reverse-proxies it — see
# nginx.conf), so VITE_GIT_CORS_PROXY doesn't need to be set for that case.
#
# To serve under a subpath (e.g. /linkml-editor/) set BASE_PATH and
# VITE_BASE_URL to the same value, and point VITE_GIT_CORS_PROXY at that
# subpath too:
#
#   BASE_PATH=/linkml-editor/ \
#   VITE_BASE_URL=/linkml-editor/ \
#   VITE_GIT_CORS_PROXY=https://your-domain.com/linkml-editor/cors-proxy \
#     docker compose -f deploy/web/docker-compose.yml up --build
#
# Host port: defaults to 8080, not 80 — rootless Podman can't bind port 80
# without extra host configuration (net.ipv4.ip_unprivileged_port_start).
# Override with WEB_PORT=<port> if 8080 is already taken.
#
# Run from the repo root:
#   docker compose -f deploy/web/docker-compose.yml up --build
#   podman-compose -f deploy/web/docker-compose.yml up --build

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile.web
      args:
        # Must all match each other — see the header comment above.
        BASE_PATH: ${BASE_PATH:-/}
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
        VITE_GIT_CORS_PROXY: ${VITE_GIT_CORS_PROXY:-/cors-proxy}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    build:
      context: ../../packages/proxy
    environment:
      - PORT=9999
      # Restrict to your app's domain in production, e.g.:
      # ALLOW_ORIGIN=https://your-domain.com
      - ALLOW_ORIGIN=*
    restart: unless-stopped
    # The proxy is intentionally not exposed on a host port — nginx reverse
    # proxies /cors-proxy/ to it so it's reachable on the same origin.
    # Uncomment to expose it directly for debugging:
    # ports:
    #   - "9999:9999"
